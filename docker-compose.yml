version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  # --- BANCOS DE DADOS ---
  postgres-usuarios:
    image: postgres:15-alpine
    container_name: db-usuarios
    environment:
      POSTGRES_USER: user_usr
      POSTGRES_PASSWORD: password_usr
      POSTGRES_DB: usuarios_db
    volumes:
      - dados-usuarios:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_usr -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-produtos:
    image: postgres:15-alpine
    container_name: db-produtos
    environment:
      POSTGRES_USER: user_prod
      POSTGRES_PASSWORD: password_prod
      POSTGRES_DB: produtos_db
    volumes:
      - dados-produtos:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_prod -d produtos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-pedidos:
    image: postgres:15-alpine
    container_name: db-pedidos
    environment:
      POSTGRES_USER: user_ped
      POSTGRES_PASSWORD: password_ped
      POSTGRES_DB: pedidos_db
    volumes:
      - dados-pedidos:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_ped -d pedidos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MICROSERVIÇOS ---
  servico-usuarios:
    build: ./servico-usuarios
    container_name: servico-usuarios
    depends_on:
      postgres-usuarios:
        condition: service_healthy
    environment:
      - SERVER_PORT=:8081
      - DATABASE_URL=postgres://user_usr:password_usr@db-usuarios:5432/usuarios_db?sslmode=disable
    networks:
      - app-network

  servico-produtos:
    build: ./servico-produtos
    container_name: servico-produtos
    depends_on:
      postgres-produtos:
        condition: service_healthy
    environment:
      - SERVER_PORT=:8082
      - DATABASE_URL=postgres://user_prod:password_prod@db-produtos:5432/produtos_db?sslmode=disable
    networks:
      - app-network

  servico-pedidos:
    build: ./servico-pedidos
    container_name: servico-pedidos
    depends_on:
      postgres-pedidos:
        condition: service_healthy
    environment:
      - SERVER_PORT=:8083
      - DATABASE_URL=postgres://user_ped:password_ped@db-pedidos:5432/pedidos_db?sslmode=disable
      - URL_USUARIOS=http://servico-usuarios:8081
      - URL_PRODUTOS=http://servico-produtos:8082
    networks:
      - app-network

  # --- API GATEWAY (Apenas Interno) ---
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - servico-usuarios
      - servico-produtos
      - servico-pedidos
    environment:
      - SERVER_PORT=:8080
      - USER_SERVICE_URL=http://servico-usuarios:8081
      - PRODUCT_SERVICE_URL=http://servico-produtos:8082
      - ORDER_SERVICE_URL=http://servico-pedidos:8083
    # Nenhuma porta exposta aqui, o acesso é via frontend
    networks:
      - app-network

  # --- FRONTEND (Nginx - Recebe da Cloudflare) ---
  frontend:
    build: ./front
    container_name: frontend-app
    depends_on:
      - api-gateway
    ports:
      - "3000:80"  # Cloudflare (443) -> Roteador (80) -> Aqui (80)
    networks:
      - app-network

volumes:
  dados-usuarios:
  dados-produtos:
  dados-pedidos: