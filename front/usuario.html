<!DOCTYPE html>
<html class="dark" lang="pt">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cadastrar - Gerenciador Moderno</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display dark group/design-root overflow-x-hidden">
    <div class="flex w-full grow items-center justify-center bg-background-light dark:bg-background-dark py-12">
        <div class="w-full max-w-md p-4">
            <h1 class="text-gray-800 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-6">Crie sua conta</h1>
            <div class="flex flex-col gap-4 px-4">
                <input id="nome" class="form-input flex w-full rounded-lg bg-white dark:bg-[#192633] text-gray-800 dark:text-white p-4" placeholder="Digite seu nome"/>
                <input id="email" class="form-input flex w-full rounded-lg bg-white dark:bg-[#192633] text-gray-800 dark:text-white p-4" placeholder="Digite seu email" type="email"/>
            </div>
            <div class="flex flex-col items-center gap-4 px-4 pt-8">
                <button onclick="criarUsuario()" class="flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-bold text-white hover:bg-primary/90 cursor-pointer">Cadastrar</button>
            </div>
        </div>
    </div>
</div>
<script>
    async function criarUsuario() {
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        if (!nome || !email) return alert("Preencha todos os campos");

        try {
            // URL Relativa: o Nginx redireciona para a API
            const response = await fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email })
            });

            if (response.ok) {
                const data = await response.json();
                alert(`Usuário criado! ID: ${data.id}`);
                localStorage.setItem('ultimoUsuarioID', data.id);
                window.location.href = 'produto.html';
            } else {
                alert("Erro ao criar usuário");
            }
        } catch (error) {
            console.error(error);
            alert("Erro na comunicação com a API");
        }
    }
</script>
</body>
</html>
