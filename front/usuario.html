<!DOCTYPE html>
<html class="dark" lang="pt">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cadastrar - Gerenciador Moderno</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col font-display dark group/design-root overflow-x-hidden">
    <div class="flex w-full grow items-center justify-center bg-background-light dark:bg-background-dark py-12">
        <div class="w-full max-w-md p-4">
            <div class="flex justify-center pb-8">
                <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-primary">
                    <span class="material-symbols-outlined text-white text-4xl">hexagon</span>
                </div>
            </div>
            <h1 class="text-gray-800 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center pb-6 pt-0 px-4">Crie sua conta</h1>

            <div class="flex flex-col gap-4 px-4">
                <label class="flex flex-col w-full">
                    <p class="text-gray-600 dark:text-white text-base font-medium leading-normal pb-2">Nome</p>
                    <input id="nome" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#324d67] bg-white dark:bg-[#192633] h-14 placeholder:text-gray-400 dark:placeholder:text-[#92adc9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="Digite seu nome" value=""/>
                </label>
                <label class="flex flex-col w-full">
                    <p class="text-gray-600 dark:text-white text-base font-medium leading-normal pb-2">Email</p>
                    <input id="email" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-[#324d67] bg-white dark:bg-[#192633] h-14 placeholder:text-gray-400 dark:placeholder:text-[#92adc9] p-[15px] text-base font-normal leading-normal transition-all" placeholder="Digite seu email" type="email" value=""/>
                </label>
            </div>

            <div class="flex flex-col items-center gap-4 px-4 pt-8">
                <button onclick="criarUsuario()" class="flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-bold text-white shadow-sm transition-all hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary cursor-pointer">Cadastrar</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function criarUsuario() {
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;

        if (!nome || !email) return alert("Preencha todos os campos");

        try {
            // PORTA ALTERADA PARA 9090
            const response = await fetch('http://localhost:9090/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email })
            });

            if (response.ok) {
                const data = await response.json();
                alert(`Usuário criado com sucesso! ID: ${data.id}`);
                localStorage.setItem('ultimoUsuarioID', data.id);
                window.location.href = 'produto.html';
            } else {
                alert("Erro ao criar usuário");
            }
        } catch (error) {
            console.error(error);
            alert("Erro na comunicação com a API (Porta 9090)");
        }
    }
</script>
</body>
</html>
