<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cadastrar Produto</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: { colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" } }
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col">
    <header class="flex shrink-0 items-center bg-background-light dark:bg-background-dark p-4 pb-2">
        <button onclick="history.back()" class="text-gray-900 dark:text-white flex size-12 items-center justify-center cursor-pointer">
            <span class="material-symbols-outlined text-2xl">arrow_back</span>
        </button>
        <h1 class="text-gray-900 dark:text-white text-lg font-bold flex-1 text-center pr-12">Cadastrar Produto</h1>
    </header>
    <main class="flex-1 overflow-y-auto px-4 py-3">
        <div class="flex flex-col gap-6">
            <input id="nome" class="form-input flex w-full rounded-lg bg-white dark:bg-[#233648] text-gray-900 dark:text-white p-4" placeholder="Nome do produto"/>
            <input id="preco" class="form-input flex w-full rounded-lg bg-white dark:bg-[#233648] text-gray-900 dark:text-white p-4" placeholder="Ex: 50.00"/>
        </div>
    </main>
    <footer class="p-4 bg-background-light dark:bg-background-dark">
        <button onclick="criarProduto()" class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 bg-primary text-white font-bold hover:bg-primary/90">Adicionar Produto</button>
    </footer>
</div>
<script>
    async function criarProduto() {
        const nome = document.getElementById('nome').value;
        let precoStr = document.getElementById('preco').value.replace(',', '.');
        const preco = parseFloat(precoStr);

        if (!nome || isNaN(preco)) return alert("Preencha corretamente");

        try {
            const response = await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, preco })
            });

            if (response.ok) {
                const data = await response.json();
                alert(`Produto criado! ID: ${data.id}`);
                localStorage.setItem('ultimoProdutoID', data.id);
                window.location.href = 'pedido.html';
            } else {
                alert("Erro ao criar produto");
            }
        } catch (error) {
            console.error(error);
            alert("Erro na comunicação com a API");
        }
    }
</script>
</body>
</html>
