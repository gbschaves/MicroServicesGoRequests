<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Criar Novo Pedido</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .form-input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 3rem;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col dark group/design-root overflow-x-hidden">
    <div class="flex flex-col flex-1 h-full">
        <header class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light dark:bg-background-dark z-10">
            <div class="flex size-12 shrink-0 items-center text-gray-800 dark:text-white cursor-pointer" onclick="history.back()">
                <span class="material-symbols-outlined !text-2xl">arrow_back</span>
            </div>
            <h1 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Criar Novo Pedido</h1>
            <div class="flex size-12 shrink-0 items-center"></div>
        </header>
        <main class="flex-1 px-4 py-3">
            <div class="flex flex-col gap-6">
                <label class="flex flex-col">
                    <p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">ID do Usuário</p>
                    <div class="relative">
                        <input id="usuario_id" class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4" placeholder="Digite o ID do usuário" type="number"/>
                    </div>
                </label>
                <label class="flex flex-col">
                    <p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">ID do Produto</p>
                    <div class="relative">
                        <input id="produto_id" class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4" placeholder="Digite o ID do produto" type="number"/>
                    </div>
                </label>
                <label class="flex flex-col">
                    <p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">Quantidade</p>
                    <div class="relative">
                        <input id="quantidade" class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4" min="1" placeholder="Digite a quantidade" type="number" value="1"/>
                    </div>
                </label>
            </div>
        </main>
        <footer class="sticky bottom-0 p-4 bg-background-light dark:bg-background-dark">
            <button onclick="criarPedido()" class="flex min-w-[84px] w-full max-w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-dark focus:ring-primary transition-colors">
                <span class="truncate">Criar Pedido</span>
            </button>
        </footer>
    </div>
</div>

<script>
    window.onload = function() {
        const uid = localStorage.getItem('ultimoUsuarioID');
        const pid = localStorage.getItem('ultimoProdutoID');
        if(uid) document.getElementById('usuario_id').value = uid;
        if(pid) document.getElementById('produto_id').value = pid;
    }

    async function criarPedido() {
        const usuario_id = parseInt(document.getElementById('usuario_id').value);
        const produto_id = parseInt(document.getElementById('produto_id').value);
        const quantidade = parseInt(document.getElementById('quantidade').value);

        if (!usuario_id || !produto_id || !quantidade) return alert("Preencha todos os campos");

        try {
            // PORTA ALTERADA PARA 9090
            const response = await fetch('http://100.85.99.51:9090/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id, produto_id, quantidade })
            });

            if (response.ok) {
                const data = await response.json();
                alert(`Sucesso! Pedido ID: ${data.id} criado.`);
            } else {
                const err = await response.json();
                alert("Erro: " + (err.error || "Falha ao criar pedido"));
            }
        } catch (error) {
            console.error(error);
            alert("Erro de conexão com API (Porta 9090)");
        }
    }
</script>
</body>
</html>
