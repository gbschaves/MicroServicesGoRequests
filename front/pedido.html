<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Criar Pedido</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: { colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" } }
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col dark group/design-root">
    <header class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-background-light dark:bg-background-dark z-10">
        <div class="flex size-12 shrink-0 items-center text-gray-800 dark:text-white cursor-pointer" onclick="history.back()">
            <span class="material-symbols-outlined !text-2xl">arrow_back</span>
        </div>
        <h1 class="text-gray-900 dark:text-white text-lg font-bold flex-1 text-center pr-12">Criar Pedido</h1>
    </header>
    <main class="flex-1 px-4 py-3 flex flex-col gap-6">
        <input id="usuario_id" class="flex w-full rounded-lg bg-white dark:bg-gray-800/50 text-gray-800 dark:text-white p-4" placeholder="ID Usuário" type="number"/>
        <input id="produto_id" class="flex w-full rounded-lg bg-white dark:bg-gray-800/50 text-gray-800 dark:text-white p-4" placeholder="ID Produto" type="number"/>
        <input id="quantidade" class="flex w-full rounded-lg bg-white dark:bg-gray-800/50 text-gray-800 dark:text-white p-4" placeholder="Quantidade" type="number" value="1"/>
    </main>
    <footer class="sticky bottom-0 p-4 bg-background-light dark:bg-background-dark">
        <button onclick="criarPedido()" class="flex w-full cursor-pointer items-center justify-center rounded-lg h-12 bg-primary text-white font-bold hover:bg-primary/90">Criar Pedido</button>
    </footer>
</div>
<script>
    window.onload = function() {
        const uid = localStorage.getItem('ultimoUsuarioID');
        const pid = localStorage.getItem('ultimoProdutoID');
        if(uid) document.getElementById('usuario_id').value = uid;
        if(pid) document.getElementById('produto_id').value = pid;
    }
    async function criarPedido() {
        const usuario_id = parseInt(document.getElementById('usuario_id').value);
        const produto_id = parseInt(document.getElementById('produto_id').value);
        const quantidade = parseInt(document.getElementById('quantidade').value);
        if (!usuario_id || !produto_id || !quantidade) return alert("Preencha tudo");

        try {
            const response = await fetch('/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario_id, produto_id, quantidade })
            });
            if (response.ok) {
                const data = await response.json();
                alert(`Pedido criado! ID: ${data.id}`);
            } else {
                const err = await response.json();
                alert("Erro: " + (err.error || "Falha"));
            }
        } catch (error) {
            console.error(error);
            alert("Erro na conexão");
        }
    }
</script>
</body>
</html>
