<div class="flex flex-col flex-1 h-full">

<h1 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Criar Novo Pedido</h1>
<div class="flex size-12 shrink-0 items-center"></div>
</header>
<main class="flex-1 px-4 py-3">
<div class="flex flex-col gap-6">
<label class="flex flex-col">
<p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">ID do Usuário</p>
<div class="relative">
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4" placeholder="Digite o ID do usuário" type="text"/>
</div>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">ID do Produto</p>
<div class="relative">
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4" placeholder="Digite o ID do produto" type="text"/>
</div>
</label>
<label class="flex flex-col">
<p class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2">Quantidade</p>
<div class="relative">
<input class="flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-800 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal pr-4 [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" min="1" placeholder="Digite a quantidade" type="number" value="1"/>
</div>
</label>
</div>
</main>
<footer class="sticky bottom-0 p-4 bg-background-light dark:bg-background-dark">
<button class="flex min-w-[84px] w-full max-w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-dark focus:ring-primary transition-colors">
